# One-command deploy for Oracle (or any Docker host).
#   docker compose up -d --build
#
# Requires a `.env` file next to this one (cp .env.example .env and fill in API_KEY).

services:
  embed-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: embed-server:latest
    container_name: embed-server
    restart: always
    env_file:
      - .env
    ports:
      # Bind to all interfaces so Vercel can reach it via the Oracle public IP.
      # Change to "127.0.0.1:8080:8080" if you put Caddy/Cloudflared in front.
      - "${PORT:-3000}:${PORT:-3000}"
    # Allow the container to use almost all of the box's RAM plus swap.
    # An earlier 850m cap was triggering swap-thrashing during inference
    # because the cgroup hit its ceiling while the OS still had free RAM.
    mem_limit: 950m
    memswap_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
